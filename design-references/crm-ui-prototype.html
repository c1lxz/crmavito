  <style>

    html,body{margin:0;height:100%;background:radial-gradient(circle at 86% -20%,#173c75 0,transparent 31%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}svg{display:block}.app{height:100%;display:grid;grid-template-columns:72px 218px minmax(0,1fr)}.rail{background:#061421;border-right:1px solid rgba(147,178,206,.1);display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:16px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#6796ff,#3566de);box-shadow:0 12px 28px rgba(49,94,220,.28);font-weight:750}.rbtn{width:42px;height:42px;border:0;border-radius:12px;color:#6f8498;background:transparent;display:grid;place-items:center}.rbtn:hover,.rbtn.active{color:#eaf2ff;background:#102640}.rbtn svg{width:18px}.spacer{flex:1}.sidebar{min-height:0;background:rgba(8,23,39,.92);border-right:1px solid rgba(147,178,206,.1);display:flex;flex-direction:column}.brand{padding:26px 22px 20px;border-bottom:1px solid rgba(147,178,206,.08)}.brand strong{display:block;font-size:17px}.brand small{color:var(--dim)}.navscroll{padding:15px 12px;overflow:auto;scrollbar-width:none}.group{margin:13px 10px 7px;color:#50667c;font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.navitem{width:100%;height:38px;padding:0 11px;border:0;border-radius:10px;background:transparent;color:#8398ad;display:flex;align-items:center;gap:10px;text-align:left;font-weight:580;font-size:12px}.navitem:hover{background:#0d2136;color:#c9d8e7}.navitem.active{color:#f4f8ff;background:linear-gradient(90deg,rgba(86,138,255,.24),rgba(86,138,255,.08));box-shadow:inset 2px 0 var(--blue)}.navitem svg{width:15px;height:15px}.profile{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(147,178,206,.1);display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:11 padding:17px 19px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:7px;font-size:20px;font-variant-numeric:tabular-nums}.metric small{display:block;margin-top:4px;color:var(--dim)}.up{color:var(--green)!important}.down{color:var(--red)!important}.grid2{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(280px,.8fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(15,34,56,.97),rgba(11,27,45,.94));box-shadow:0 12px 38px rgba(0,0,0,.09);overflow:hidden}.card.pad{padding:20px}.cardhead{height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(148,177,204,.11)}.cardhead h2,.card h2{margin:0;font-size:14px}.link{color:#79a2ff;font-size:11px;font-weight:650}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{height:37px;padding:0 16px;color:#5f758a;font-size:10px;text-align:left;text-transform:uppercase;letter-spacing:.06em}.table td{height:57px;padding:0 16px;border-top:1px solid rgba(147,178,206,.08);color:#b2c1cf;font-size:12px}.table tbody tr:hover{background:rgba(86,138,255,.045)}.table strong{color:var(--text);font-weight:620}.sub{display:block;color:var(--dim);font-size:10px;margin-top:2px}.money{color:#e8f0f7!important;font-variant-numeric:tabular-nums;font-weight:650}.status{display:inline-flex;align-items:center;gap:5px;width:max-content;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:700}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.s-green{color:#70d4aa;background:rgba(89,201,154,.11)}.s-blue{color:#80aaff;background:rgba(86,138,255,.12)}.s-amber{color:#eac17f;background:rgba(230,184,108,.11)}.s-red{color:#ed969e;background:rgba(221,125,134,.11)}.s-grey{color:#a8b7c4;background:rgba(142,161,180,.1)}.hero{height:270px;padding:22px;position:relative}.hero .value{font-size:30px;font-weight:680;margin-top:8px}.hero svg{position:absolute;left:22px;right:22px;bottom:23px;width:calc(100% - 44px);height:130px}.list{padding:4px 18px}.listrow{min-height:58px;padding:12px 0;border-top:1px solid rgba(147,178,206,.09);display:flex;align-items:center;justify-content:space-between;gap:12px}.listrow:first-child{border-top:0}.listrow strong{display:block;font-size:12px}.listrow span{display:block;color:var(--dim);font-size:10px;margin-top:3px}.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:0 0 auto}.lineleft{display:flex;align-items:center;gap:10px}.product{display:flex;align-items:center;gap:10px}.thumb{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;color:#20415f;background:linear-gradient(145deg,#dce8f2,#7891a8);font-size:10px;font-weight:800}.empty{padding:54px 24px;text-align:center}.empty .emptyicon{width:50px;height:50px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;color:#7996b1;background:#122b45}.empty h3{margin:0 0 6px}.empty p{margin:0 auto 18px;max-width:360px;color:var(--muted);font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgroup label{display:block;margin-bottom:7px;color:#9fb0c0;font-size:11px;font-weight:620}.input{width:100%}.textarea{min-height:88px;width:100%;padding:11px 12px;resize:none}.help{display:block;margin-top:6px;color:var(--dim);font-size:10px}.board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}.column{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(10,25,42,.58)}.colhead{display:flex;justify-content:space-between;color:#9fb1c1;font-size:11px;font-weight:700;margin-bottom:11px}.task{padding:14px;margin-top:9px;border:1px solid rgba(147,178,206,.1);border-radius:12px;background:var(--card)}.task strong{display:block;font-size:12px}.task p{margin:7px 0 11px;color:var(--muted);font-size:10px}.taskfoot{display:flex;align-item <body>
<div class="mobilebar top"><strong>CRM Avito</strong><button class="btn primary" data-modal="order">+ Заказ</button></div>
<div class="mobilebar bottom"><button data-screen="dashboard" class="active">Главная</button><button data-screen="orders">Заказы</button><button data-screen="notebook">Блокнот</button><button data-screen="returns">Возвраты</button><button data-screen="settings">Ещё</button></div>
<div class="app">
  <aside class="rail">
    <div class="logo">C</div>
    <button class="rbtn active" aria-label="Работа"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9 20v-6h6v6"/></svg></button>
    <button class="rbtn" aria-label="Управление"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m4 8 8-4 8 4v11H4z"/><path d="M9 19v-6h6v6M4 8h16"/></svg></button>
    <button class="rbtn" aria-label="Аналитика"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg></button>
    <div class="spacer"></div>
    <button class="rbtn" data-screen="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.5 1A8 8 0 0 0 14 5.6L13.6 3h-4L9 5.6A8 8 0 0 0 6.6 7L4.1 6 2 9.4 4.1 11a7 7 0 0 0 0 2L2 14.6 4.1 18l2.5-1A8 8 0 0 0 9 18.4l.6 2.6h4l.5-2.6a8 8 0 0 0 2.4-1.4l2.5 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg></button>
  </aside>
  <aside class="sidebar">
    <div class="brand"><strong>CRM Avito</strong><small>Рабочая панель</small></div>
    <nav class="navscroll" id="nav"></nav>
    <div class="profile"><div class="avatar">А</div><div><strong>Алексей</strong><small>Администратор</small></div></div>
  </aside>
  <main class="main"><div id="screen" class="fade"></div></main>
</div>

<div class="modalback" id="modal">
  <section class="modal" role="dialog" aria-modal="true">
    <div class="modalhead"><div><h2 id="modalTitle">Новый заказ</h2><span class="sub">Черновик сохраняется автоматически</span></div><button class="close" data-close aria-label="Закрыть">×</button></div>
    <div class="modalbody" id="modalBody"></div>
    <div class="modalfoot"><button class="btn ghost" data-close>Отмена</button><button class="btn primary" data-close>Сохранить</button></div>
  </section>
</div>

<script>
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8M12 8v8"/></svg>';
const navEl=document.getElementById('nav'),screenEl=document.getElementById('screen'),modalEl=document.getElementById('modal'),modalTitleEl=document.getElementById('modalTitle'),modalBodyEl=document.getElementById('modalBody');
const groups=[
 ['Работа',[['dashboard','Главная'],['orders','Заказы'],['notebook','Блокнот'],['returns','Возвраты'],['warehouse','Склад']]],
 ['Управление',[['products','Товары'],['wbr','WB Resale'],['expenses','Расходы'],['counterparties','Поставщики']]],
 ['Аналитика',[['reports','Отчёты'],['content','Контент-машина'],['market','Аналитика Avito'],['stocks','Остатки Avito']]],
 ['Система',[['settings','Настройки'],['audit','Журнал аудита']]],
 ['Примеры',[['order','Карточка заказа'],['launcher','Выбор режима'],['login','Экран входа']]]
];
const meta={
 dashboard:['Добрый день, Алексей','Понедельник, 28 июля · Рабочая сводка'],
 orders:['Заказы','Все продажи и отправления в одном месте'],
 order:['Заказ №45879','Создан 28 июля в 10:42 · профиль STROK SHOP'],
 notebook:['Блокнот','Задачи команды и рабочие заметки'],
 returns:['Возвраты','Решения, сроки и компенсации'],
 warehouse:['Склад','Остатки, движение и приёмка товара'],
 products:['Товары','Номенклатура, цены и маржинальность'],
 wbr:['WB Resale','Локальный агент и задания на выкуп'],
 expenses:['Расходы','Операционные затраты и регулярные платежи'],
 counterparties:['Поставщики','Контакты, закупки и взаиморасчёты'],
 reports:['Отчёты','Динамика продаж и финансовый результат'],
 content:['Контент-машина','Создание и сравнение изображений товара'],
 market:['Аналитика Avito','Конкуренты, спрос и рекомендации'],
 stocks:['Остатки Avito','Состояние публикаций и синхронизации'],
 settings:['Настройки','Профиль, команда, интеграции и интерфейс'],
 audit:['Журнал аудита','История изменений и действий пользователей'],
 launcher:['Выберите режим работы','Интерфейс адаптируется под текущую задачу'],
 login:['Вход в CRM Avito','Безопасный доступ к рабочему пространству']
};
const S=(text,c='s-grey')=>`<span class="status ${c}">${text}</span>`;
const btn=(label,primary=false,modal='')=>`<button class="btn ${primary?'primary':''}" ${modal?`data-modal="${modal}"`:''}>${label}</button>`;
const head=(key,action='')=>{const m=meta[key];return `<header class="topbar"><div class="title"><h1>${m[0]}</h1><p>${m[1]}</p></div><div class="actions"><div class="search">${icon} Поиск по CRM</div><button class="btn iconbtn" aria-label="Уведомления">${icon}</button>${action}</div></header>`};
const toolbar=(tabs,extra='')=>`<div class="toolbar"><div class="filters">${tabs.map((x,i)=>`<button class="chip ${i===0?'active':''}">${x}</button>`).join('')}</div><div class="filters">${extra}<button class="btn">Фильтры</button></div></div>`;
const table=(heads,rows)=>`<div class="card tablewrap"><table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const product=(name,id='№45879 · Авито')=>`<div class="product"><div class="thumb">${name.slice(0,2).toUpperCase()}</div><div><strong>${name}</strong><span class="sub">${id}</span></div></div>`;
const money=v=>`<span class="money">${v}</span>`;
const chart=`<svg viewBox="0 0 760 130" preserveAspectRatio="none"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#568aff" stop-opacity=".28"/><stop offset="1" stop-color="#568aff" stop-opacity="0"/></linearGradient></defs><path d="M5 112 C70 99 92 104 135 82 S216 96 253 68 S325 56 372 68 S445 99 486 54 S575 77 619 43 S696 55 755 14 L755 125 L5 125Z" fill="url(#a)"/><path d="M5 112 C70 99 92 104 135 82 S216 96 253 68 S325 56 372 68 S445 99 486 54 S575 77 619 43 S696 55 755 14" fill="none" stroke="#6796ff" stroke-width="3" stroke-linecap="round"/></svg>`;
function dashboard(){return head('dashboard',btn('+ Новый заказ',true,'order'))+`<div class="grid2"><section class="card hero"><span class="sub">Продажи за неделю</span><div class="value">156 700 ₽ <small class="up">+18,4%</small></div>${chart}</section><section class="card pad"><h2>Сегодня</h2><div class="list"><div class="listrow"><span>Заказы</span><strong>12</strong></div><div class="listrow"><span>Выручка</span><strong>24 500 ₽</strong></div><div class="listrow"><span>Прибыль</span><strong class="up">8 240 ₽</strong></div></div></section></div><div style="height:16px"></div><div class="grid2">${ordersTable(true)}<section class="card"><div class="cardhead"><h2>Требуют внимания</h2><span class="link">Смотреть все</span></div><div class="list"><div class="listrow"><div class="lineleft"><i class="dot"></i><div><strong>Заказы без трек-номера</strong><span>Добавьте данные для отправки</span></div></div><b>3</b></div><div class="listrow"><div class="lineleft"><i class="dot" style="background:var(--red)"></i><div><strong>Возврат ожидает решения</strong><span>Срок ответа истекает сегодня</span></div></div><b>1</b></div><div class="listrow"><div class="lineleft"><i class="dot" style="background:var(--blue)"></i><div><strong>Товар заканчивается</strong><span>Проверьте складские остатки</span></div></div><b>5</b></div></div></section></div>`}
function ordersTable(compact=false){return `<section class="card"><div class="cardhead"><h2>${compact?'Последние заказы':'Заказы'}</h2><span class="link">${compact?'Все заказы →':'124 результата'}</span></div>${table(['Заказ','Клиент','Сумма','Статус'],[
