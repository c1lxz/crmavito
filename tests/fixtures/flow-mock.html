<!doctype html>
<html lang="en">
  <body>
    <button data-testid="new-project">New project</button>
    <input data-testid="upload-references" type="file" multiple>
    <button id="rights">I accept</button>
    <button data-testid="add-media">Add media</button>
    <div role="dialog" hidden>
      <div id="uploaded"></div>
      <button id="attach" disabled>Add to prompt</button>
    </div>
    <textarea data-testid="prompt"></textarea>
    <button data-testid="generate">Generate</button>
    <div id="result"></div>
    <script>
      const png = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAATElEQVR4nO3PQQ0AIBDAsAP/nuGNAvZoFSzZOjNnyNi1dwfgUQCeBOBJAB4F4EkAngTgSQAeBeBJAB4F4EkAngTgSQAeBeBJAB4F4EkAHgUNAn6QyKsGAAAAAElFTkSuQmCC";
      const generatedPng = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#345"/></svg>');
      const twoK = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048"><rect width="2048" height="2048" fill="#222"/></svg>');
      const dialog = document.querySelector("[role=dialog]");
      let attachCount = 0;
      let selected = "";
      document.querySelector("#rights").addEventListener("click", (event) => event.currentTarget.remove());
      document.querySelector("[data-testid=upload-references]").addEventListener("change", (event) => {
        document.querySelector("#uploaded").innerHTML = [...event.target.files]
          .map((file) => `<img alt="${file.name}" src="${png}">`)
          .join("");
        document.querySelector("#attach").disabled = false;
      });
      document.querySelector("[data-testid=add-media]").addEventListener("click", () => {
        dialog.hidden = false;
      });
      document.querySelector("#uploaded").addEventListener("click", (event) => {
        if (!(event.target instanceof HTMLImageElement)) return;
        selected = event.target.alt;
        document.querySelector("#attach").disabled = false;
      });
      document.querySelector("#attach").addEventListener("click", () => {
        if (selected) attachCount += 1;
        selected = "";
        dialog.hidden = true;
        document.querySelector("#attach").disabled = true;
      });
      document.querySelector("[data-testid=generate]").addEventListener("click", () => {
        if (attachCount !== 2 || !document.querySelector("[data-testid=prompt]").value.trim()) return;
        setTimeout(() => {
          if (new URLSearchParams(location.search).has("limit")) {
            document.querySelector("#result").innerHTML = `<div>Вы достигли дневного лимита на генерацию. Попробуйте использовать другую модель.</div>`;
            return;
          }
          document.querySelector("#result").innerHTML = `<img data-testid="result-image" alt="Generated image" src="${generatedPng}"><button data-testid="result-download">Download</button><div role="menu" hidden><button role="menuitem">2K Upscaled</button></div>`;
          document.querySelector("[data-testid=result-download]").addEventListener("click", () => {
            document.querySelector("[role=menu]").hidden = false;
          });
          document.querySelector("[role=menuitem]").addEventListener("click", () => {
            const anchor = document.createElement("a");
            anchor.href = twoK;
            anchor.download = "result_2K.svg";
            anchor.click();
          });
        }, 180);
      });
    </script>
  </body>
</html>
